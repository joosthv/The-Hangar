<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetstream Hangar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">✈</span> Jetstream Hangar</div>
  <nav>
    <button class="tab active" data-view="library">Library</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>
  <div id="chips"></div>
</header>
<main>
  <section id="library" class="view">
    <div class="toolbar">
      <h1>Aircraft</h1>
      <button id="refresh" class="secondary">Check for updates</button>
    </div>
    <div id="notice" class="notice hidden"></div>
    <div id="cards" class="cards"></div>
  </section>
  <section id="settings" class="view hidden">
    <h1>Settings</h1>
    <form id="settingsForm">
      <label>Catalogue URL<input name="catalogUrl" placeholder="https://api.github.com/repos/joosthv/The-Hangar/contents/catalog.json"><small>catalog.json listing the aircraft and their GitHub repositories (default: the The-Hangar repository). Empty: the catalog.json next to the program.</small></label>
      <label>Community folder<input name="communityOverride" placeholder=""><small id="detected"></small></label>
      <label>GitHub token (optional)<input name="githubToken" type="password" autocomplete="off" placeholder="only needed for private repositories or rate limits"><small>Needed while the repository is private. Stored on this computer; sent only to api.github.com.</small></label>
      <label>Check for updates every<select name="checkHours"><option value="1">hour</option><option value="6">6 hours</option><option value="24">day</option></select></label>
      <label class="check"><input type="checkbox" name="autoUpdate"> Install aircraft updates automatically (waits until MSFS is closed)</label>
      <label class="check"><input type="checkbox" name="selfUpdate"> Keep Jetstream Hangar itself up to date</label>
      <label class="check"><input type="checkbox" name="prerelease"> Include pre-release (beta) versions</label>
      <label class="check"><input type="checkbox" name="autostart"> Start Jetstream Hangar with Windows (in the tray)</label>
      <div class="actions"><button type="submit">Save</button><button type="button" id="openCommunity" class="secondary">Open Community folder</button></div>
      <p id="saved" class="muted"></p>
    </form>
  </section>
</main>
<template id="cardTpl">
  <article class="card">
    <div class="thumb"></div>
    <div class="body">
      <div class="title"><h2></h2><span class="maker muted"></span></div>
      <p class="desc"></p>
      <div class="versions"></div>
      <div class="progress hidden"><div class="bar"></div><span class="ptext"></span></div>
      <div class="buttons"></div>
      <details class="notes hidden"><summary>Release notes</summary><pre></pre></details>
      <div class="tech hidden"></div>
    </div>
  </article>
</template>
<script src="app.js"></script>
</body>
</html>
